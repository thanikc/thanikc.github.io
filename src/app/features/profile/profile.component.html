<div class="container mx-auto px-4 py-8 max-w-5xl">
  <section class="hero-card rounded-2xl p-8 mb-8 shadow-sm">
    <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-6">
      <div class="space-y-2">
        <span class="hero-badge flex items-center gap-2 text-sm font-bold uppercase tracking-wider">
          {{ title() }}
        </span>
        <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight">
          Thanik Cheowtirakul
        </h1>
        <p class="hero-subtitle text-lg font-medium max-w-2xl">
          {{ subtitle() }}
        </p>
      </div>
    </div>
  </section>

  <section class="space-y-6">
    <div class="skills-header pb-3 border-b">
      <h2 class="text-2xl font-bold tracking-tight">Technical Expertise</h2>
      <p class="hero-subtitle text-sm font-medium">Core tech stack and architectural strengths</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      @for (cat of skillCategories(); track cat.category) {
      <article class="skill-card rounded-xl p-6 flex flex-col justify-between shadow-sm">
        <div>
          <div class="flex items-center gap-4 mb-4">
            <div class="card-avatar p-3 rounded-lg flex items-center justify-center">
              <mat-icon>{{ cat.icon }}</mat-icon>
            </div>
            <h3 class="text-lg font-bold">{{ cat.category }}</h3>
          </div>
          <div class="flex flex-wrap gap-2 mt-4">
            @for (skill of cat.skills; track skill) {
            <span class="skill-chip px-3 py-1 rounded-full text-xs font-semibold">
              {{ skill }}
            </span>
            }
          </div>
        </div>
      </article>
      }
    </div>
  </section>
</div>
