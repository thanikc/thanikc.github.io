<footer
  class="container mx-auto px-4 py-8 max-w-6xl flex w-full items-center justify-between gap-4"
>
  <app-ad-banner-toggle />

  <div class="flex items-center gap-4">
    @for (link of socialLinks; track link.label) {
      <a
        [href]="link.href"
        [attr.target]="link.external ? '_blank' : null"
        [attr.rel]="link.external ? 'noopener noreferrer' : null"
        class="inline-flex items-center text-slate-600 hover:text-indigo-600 dark:text-slate-300 dark:hover:text-indigo-400 transition-all duration-200 hover:-translate-y-0.5"
        [attr.aria-label]="link.ariaLabel"
        [attr.data-cta-tracking]="link.label"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="currentColor"
          class="w-5 h-5"
          aria-hidden="true"
        >
          <path [attr.d]="link.iconPath" />
        </svg>
      </a>
    }
  </div>
</footer>
