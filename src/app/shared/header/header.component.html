<mat-toolbar color="primary" class="app-header">
  <div class="header-container">
    <a routerLink="/" class="brand-link">
      <img src="logo.svg" alt="" aria-hidden="true" class="brand-logo" width="28" height="28" />
      <span>Dev Info</span>
    </a>

    <nav aria-label="Main Navigation" class="nav-links hidden md:flex">
      <a mat-button routerLink="/profile" routerLinkActive="active-link">
        <mat-icon aria-hidden="true">person</mat-icon>
        Profile
      </a>

      <a mat-button routerLink="/calculator" routerLinkActive="active-link">
        <mat-icon aria-hidden="true">calculate</mat-icon>
        Calculator
      </a>

      <app-ad-banner-toggle></app-ad-banner-toggle>
    </nav>

    @defer (on viewport) {
      <app-burger-menu class="md:hidden" />
    } @placeholder {
      <button mat-icon-button aria-label="Open menu" class="md:hidden">
        <mat-icon aria-hidden="true">menu</mat-icon>
      </button>
    }
  </div>
</mat-toolbar>
