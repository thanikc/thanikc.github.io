<mat-toolbar color="primary" class="app-header sticky top-0 z-50">
  <div class="header-container">
    <a routerLink="/" class="brand-link">
      <img src="logo.svg" alt="" aria-hidden="true" class="brand-logo" width="28" height="28" />
      <span>Dev Info</span>
    </a>

    <nav aria-label="Main Navigation" class="nav-links hidden md:flex">
      @for (link of navLinks; track link.path) {
        <a
          mat-button
          [routerLink]="link.path"
          routerLinkActive="active-link"
          [routerLinkActiveOptions]="link.activeOptions"
        >
          <mat-icon aria-hidden="true">{{ link.icon }}</mat-icon>
          {{ link.label }}
        </a>
      }

      <app-ad-banner-toggle />
    </nav>

    @defer (on viewport) {
      <app-burger-menu class="md:hidden" />
    } @placeholder {
      <button mat-icon-button aria-label="Open menu" class="md:hidden">
        <mat-icon aria-hidden="true">menu</mat-icon>
      </button>
    }
  </div>
</mat-toolbar>
