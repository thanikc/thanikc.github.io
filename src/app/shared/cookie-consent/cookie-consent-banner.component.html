@if (visible()) {
  <div
    class="cookie-banner fixed inset-x-0 bottom-0 z-50 flex flex-col gap-3 border-t p-4 backdrop-blur sm:flex-row sm:items-center sm:justify-between"
    role="region"
    aria-label="Cookie consent"
  >
    <p class="cookie-text max-w-prose text-sm">
      This site uses cookies for analytics and ads. You can accept or reject non-essential cookies.
      Learn more in our
      <a routerLink="/privacy-policy" class="cookie-link underline">Privacy Policy</a>.
    </p>
    <div class="flex shrink-0 gap-2 self-end sm:self-auto">
      <button matButton="outlined" type="button" class="min-h-11" (click)="reject()">Reject</button>
      <button matButton="filled" type="button" class="min-h-11" (click)="accept()">Accept</button>
    </div>
  </div>
}
