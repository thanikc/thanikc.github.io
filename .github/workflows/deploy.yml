name: Enterprise CI/CD Deployment

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Production Build
        run: npm run build -- --configuration=production --base-href="https://github.io"

      - name: Upload Build Artifact to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/thanikc/browser

      - name: Deploy to GitHub Pages Webserver
        id: deployment
        uses: actions/deploy-pages@v4
