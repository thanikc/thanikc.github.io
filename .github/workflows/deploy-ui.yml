name: Deploy UI to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/ui/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-ui.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Tests
        run: pnpm --filter @thanikc/ui test

      # A missing translation falls back to English in a build that otherwise succeeds.
      - name: Check Translations
        run: pnpm --filter @thanikc/ui i18n:check

      # build:pages, not build: it adds the deployment root the localized build
      # leaves empty (language redirect + the root-only files). See
      # apps/ui/scripts/emit-pages-root.mjs.
      - name: Production Build
        run: pnpm --filter @thanikc/ui build:pages

      # Only the e2e covers the root redirect and CI doesn't run it: a build missing these still deploys.
      - name: Check deployment root
        working-directory: apps/ui/dist/thanikc/browser
        run: |
          for f in index.html 404.html robots.txt sitemap.xml en/index.html de/index.html th/index.html; do
            test -s "$f" || { echo "missing or empty: $f"; exit 1; }
          done

      - name: Upload Build Artifact to GitHub Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./apps/ui/dist/thanikc/browser

      - name: Deploy to GitHub Pages Webserver
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
