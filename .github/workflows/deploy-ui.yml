name: Deploy UI to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/ui/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-ui.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Tests
        run: pnpm --filter @thanikc/ui test

      # A missing translation falls back to English in a build that otherwise succeeds.
      - name: Check Translations
        run: pnpm --filter @thanikc/ui i18n:check

      # build:pages, not build: it adds the deployment root the localized build
      # leaves empty (language redirect + the root-only files). See
      # apps/ui/scripts/emit-pages-root.mjs.
      - name: Production Build
        run: pnpm --filter @thanikc/ui build:pages

      # Only the e2e covers the root redirect and CI doesn't run it: a build missing these still deploys.
      - name: Check deployment root
        working-directory: apps/ui/dist/thanikc/browser
        run: |
          for f in index.html 404.html robots.txt sitemap.xml en/index.html de/index.html th/index.html; do
            test -s "$f" || { echo "missing or empty: $f"; exit 1; }
          done

      - name: Upload Build Artifact to GitHub Pages
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./apps/ui/dist/thanikc/browser

      - name: Deploy to GitHub Pages Webserver
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
