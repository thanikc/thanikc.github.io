name: AI Ling alerts

# Hourly health check on the Analytics Engine dataset. Opens (or comments on) one issue
# labelled ai-ling-alert while a threshold is breached, and closes it when all pass.
# GitHub's notification email is the alert channel.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: 'ai-ling-alerts'
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Evaluate thresholds
        id: alerts
        run: node apps/worker/scripts/alerts.mjs > "$RUNNER_TEMP/alerts.json"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
          # Keep in step with DAILY_GENERATION_LIMIT in apps/worker/wrangler.jsonc.
          DAILY_LIMIT: '1000'

      - name: Open, update or close the alert issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(jq -r .breached "$RUNNER_TEMP/alerts.json")" = "true" ]; then
            jq -r .body "$RUNNER_TEMP/alerts.json" > "$RUNNER_TEMP/body.md"
            .github/scripts/alert-issue.sh raise "$(jq -r .title "$RUNNER_TEMP/alerts.json")" "$RUNNER_TEMP/body.md"
          else
            .github/scripts/alert-issue.sh clear
          fi
