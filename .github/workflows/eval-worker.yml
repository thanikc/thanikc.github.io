name: Eval AI Ling

# Hits the deployed worker and its free-tier providers, so it only runs for PRs
# that can change answers. It grades the worker as currently deployed: merge, let
# deploy-worker finish, then re-run (workflow_dispatch) to check the new build.
on:
  pull_request:
    paths:
      - 'apps/worker/content/**'
      - 'apps/worker/src/**'
      - 'apps/worker/scripts/eval.mjs'
  # Nightly, against production: catches a provider or model changing underneath us.
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write # nightly failures open or update the ai-ling-alert issue

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # --delay keeps the run under the worker's 10 requests/minute CHAT_LIMIT.
      - name: Run eval
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: node apps/worker/scripts/eval.mjs --url https://thanikc-worker.thanikc.workers.dev --delay 7000

      - name: Raise alert
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'The nightly AI Ling eval failed: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/body.md"
          .github/scripts/alert-issue.sh raise "AI Ling alert" "$RUNNER_TEMP/body.md"
