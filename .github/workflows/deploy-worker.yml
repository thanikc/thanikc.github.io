name: Deploy Worker to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'apps/worker/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'worker-deploy'
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Tests
        run: pnpm --filter @thanikc/worker test

      # Before the deploy, so new code never runs against an older schema.
      - name: Apply database migrations
        run: pnpm --filter @thanikc/worker exec wrangler d1 migrations apply CACHE_DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/worker
          packageManager: pnpm
          secrets: |
            GROQ_API_KEY
            GOOGLE_AI_API_KEY
            OPENROUTER_API_KEY
            INGEST_TOKEN
            TURNSTILE_SECRET
            SESSION_SECRET
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}

      # A new prompt or model must not keep serving answers made by the old one. Unchanged
      # documents don't purge on ingest below, so this is the only clear such a deploy gets.
      - name: Clear answer cache
        run: pnpm --filter @thanikc/worker exec wrangler d1 execute CACHE_DB --remote --command "DELETE FROM answer_cache"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # After the deploy so the live worker has the hash-skip: unchanged documents
      # cost no embeddings, and a real change empties the answer cache.
      - name: Re-ingest content
        run: pnpm --filter @thanikc/worker ingest:deployed
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
