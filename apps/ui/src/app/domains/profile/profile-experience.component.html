<section
  class="experience-section relative flex flex-col gap-10 py-10 sm:py-14"
  [attr.aria-labelledby]="headingId"
>
  <div class="mx-auto w-full max-w-6xl px-4">
    <app-section-header
      i18n-eyebrow="Heading of the experience section@@experience.heading"
      eyebrow="Experience"
      [headingId]="headingId"
      i18n-heading="Subtitle of the experience section@@experience.subtitle"
      heading="Scale and responsibility, in specifics"
    />
  </div>

  @for (stat of stats(); track stat.headline; let i = $index) {
    <article
      class="experience-entry surface-card-enter mx-auto flex w-full max-w-6xl flex-col gap-2 px-4"
      [style.animation-delay.ms]="i * 80"
    >
      <span class="experience-number text-xs font-bold tracking-widest uppercase">{{
        numberFor(i)
      }}</span>
      <h3 class="font-display text-3xl font-normal tracking-tight sm:text-4xl">
        {{ stat.headline }}
      </h3>
      <p class="max-w-prose text-lg leading-relaxed">{{ stat.detail }}</p>
      <app-ask-ling-link
        class="-ml-3 self-start"
        [question]="stat.question"
        [label]="stat.hookLabel"
      />
    </article>
  } @empty {
    <p class="page-muted mx-auto w-full max-w-6xl px-4 text-sm" i18n="@@common.emptySection">
      Nothing to show yet.
    </p>
  }
</section>
