<div class="ask-ling-invite space-y-3">
  <h2
    class="text-xl font-bold tracking-tight sm:text-2xl"
    i18n="Heading of the Ask AI Ling invitation@@askLing.heading"
  >
    Want the details? Ask AI Ling.
  </h2>
  <p
    class="ask-ling-pitch max-w-2xl text-sm leading-relaxed"
    i18n="Pitch for the AI assistant@@askLing.pitch"
  >
    It's the fastest way through the rest of this page: ask about a project, a technology choice, or
    an engineering decision, and it answers from what I've actually written and built.
  </p>

  @if (prompts().length > 0) {
    <div class="flex flex-wrap gap-2">
      @for (prompt of prompts(); track prompt) {
        <app-ask-ling-link appearance="outlined" [question]="prompt" [label]="prompt" />
      }
    </div>
  }
</div>
