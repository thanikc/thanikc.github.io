<section class="space-y-6" [attr.aria-labelledby]="headingId">
  <!-- Two-tone headline: the claim reads full-strength, the scope detail recedes. -->
  <app-section-header
    i18n-eyebrow="Heading of the projects section@@projects.heading"
    eyebrow="Things I’ve built"
    [headingId]="headingId"
    muted
  >
    <ng-container i18n="Subtitle of the projects section@@projects.subtitle"
      ><strong class="page-heading font-semibold">Complete products I build independently,</strong>
      from data model to deployment</ng-container
    >
  </app-section-header>

  @if (ordered().length > 0) {
    <!-- Two columns from md: wide enough for the tagline and decision to read as
         sentences. items-start, so opening one card's details doesn't stretch its
         neighbour into an empty box. -->
    <div class="projects-grid grid grid-cols-1 items-start gap-6 md:grid-cols-2">
      @for (project of ordered(); track project.name; let i = $index) {
        <app-project-card [project]="project" [index]="i" />
      }
    </div>
  } @else {
    <p class="page-muted text-sm" i18n="@@common.emptySection">Nothing to show yet.</p>
  }
</section>
