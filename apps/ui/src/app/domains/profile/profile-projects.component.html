<section class="space-y-6" [attr.aria-labelledby]="headingId">
  <app-section-header
    i18n-eyebrow="Heading of the projects section@@projects.heading"
    eyebrow="Things I’ve built"
    [headingId]="headingId"
    i18n-heading="Subtitle of the projects section@@projects.subtitle"
    heading="Complete products I build independently, from data model to deployment"
  />

  @if (ordered().length > 0) {
    <!-- Two columns from md: wide enough for the tagline and decision to read as
         sentences. Cards in a row stretch to one height; each pins its actions to
         the bottom, so the row's buttons line up. -->
    <div class="projects-grid grid grid-cols-1 gap-6 md:grid-cols-2">
      @for (project of ordered(); track project.name; let i = $index) {
        <app-project-card [project]="project" [index]="i" />
      }
    </div>
  } @else {
    <p class="page-muted text-sm" i18n="@@common.emptySection">Nothing to show yet.</p>
  }
</section>
