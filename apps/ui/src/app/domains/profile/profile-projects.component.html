<section class="space-y-6" [attr.aria-labelledby]="headingId">
  <!-- Bespoke header, not <app-section-header>: the headline
       mixes weight/tone — the claim reads full-strength,
       the scope detail recedes — which the shared component's plain-string heading can't
       express. Same copy as before, just which words carry the emphasis. -->
  <div class="space-y-3">
    <p
      class="page-muted font-mono text-xs tracking-widest uppercase"
      i18n="Heading of the projects section@@projects.heading"
    >
      Things I’ve built
    </p>
    <h2
      [id]="headingId"
      class="section-heading page-muted font-display scroll-mt-24 text-3xl font-normal tracking-tight sm:text-4xl"
      i18n="Subtitle of the projects section@@projects.subtitle"
    >
      <strong class="page-heading font-semibold">Complete products I build independently,</strong>
      from data model to deployment
    </h2>
  </div>

  @if (ordered().length > 0) {
    <!-- Two columns from md: wide enough for the tagline and decision to read as
         sentences. items-start, so opening one card's details doesn't stretch its
         neighbour into an empty box. -->
    <div class="projects-grid grid grid-cols-1 items-start gap-6 md:grid-cols-2">
      @for (project of ordered(); track project.name; let i = $index) {
        <app-project-card [project]="project" [index]="i" />
      }
    </div>
  } @else {
    <p class="page-muted text-sm" i18n="@@common.emptySection">Nothing to show yet.</p>
  }
</section>
