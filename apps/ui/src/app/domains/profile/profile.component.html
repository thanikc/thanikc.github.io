<div class="profile-page flex flex-col flex-1">
  <app-profile-hero />

  <app-profile-themes [themes]="workThemes" />

  <section class="space-y-6 mt-10">
    <div class="skills-header pb-3 border-b">
      <h2 class="text-2xl font-bold tracking-tight">Beyond the Code</h2>
      <p class="hero-subtitle text-sm font-medium">
        How I stay physical, sharp, and curious away from the keyboard
      </p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
      @for (interest of interests; track interest.name; let i = $index) {
        <article
          class="skill-card interest-card rounded-xl p-6 flex flex-col gap-4 shadow-sm"
          [style.animation-delay.ms]="i * 80"
        >
          <div class="flex items-center gap-4">
            <div class="card-avatar p-3 rounded-lg flex items-center justify-center">
              <mat-icon>{{ interest.icon }}</mat-icon>
            </div>
            <h3 class="text-lg font-bold">{{ interest.name }}</h3>
          </div>
          <p class="hero-subtitle text-sm">{{ interest.description }}</p>
        </article>
      } @empty {
        <p class="hero-subtitle text-sm">No interests to show yet.</p>
      }
    </div>
  </section>

  <app-profile-projects class="mt-10 block" [projects]="projects" />

  <app-profile-principles class="mt-10 mb-8 block" [principles]="principles" />

  <div
    class="ad-slot rounded-xl px-4 pt-3 pb-1 mt-auto"
    [style.display]="showBanner() ? '' : 'none'"
  >
    <p class="ad-label text-xs font-semibold uppercase tracking-wider text-center mb-1">
      Advertisement
    </p>
    <app-ad-banner [visible]="showBanner()" />
  </div>
</div>
