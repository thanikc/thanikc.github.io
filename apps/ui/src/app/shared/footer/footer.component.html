<footer
  id="contact"
  class="container mx-auto px-4 py-4 max-w-6xl flex w-full flex-col items-center gap-4 scroll-mt-24 sm:flex-row sm:flex-wrap"
>
  @if (adsEnabled) {
    <app-ad-banner-toggle />
  }

  <p
    class="footer-note surface-muted order-2 flex max-w-md items-start gap-1.5 text-xs font-thin sm:order-none"
  >
    <mat-icon class="footer-note-icon shrink-0" aria-hidden="true">info</mat-icon>
    <span
      >I build this site test-first to try something real but low-stakes. The source is
      public.</span
    >
  </p>

  <div class="order-1 flex flex-wrap items-center justify-center gap-4 sm:order-none sm:ml-auto">
    <a
      routerLink="/privacy-policy"
      class="footer-link order-2 inline-flex min-h-11 items-center text-sm font-medium hover:underline sm:order-none"
    >
      Privacy Policy
    </a>

    <div class="order-1 flex flex-wrap items-center gap-2 sm:order-none">
      @for (link of socialLinks; track link.label) {
        <a
          [href]="link.href"
          [attr.target]="link.external ? '_blank' : null"
          [attr.rel]="link.external ? 'noopener noreferrer' : null"
          class="social-link inline-flex min-h-11 min-w-11 items-center justify-center gap-1.5 rounded-full px-3 text-sm font-medium transition-transform duration-200 hover:-translate-y-0.5"
          [attr.aria-label]="link.ariaLabel"
          [attr.data-cta-tracking]="link.label"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            class="w-5 h-5"
            aria-hidden="true"
          >
            <path [attr.d]="link.iconPath" />
          </svg>
          <span>{{ link.shortLabel }}</span>
        </a>
      }
    </div>
  </div>
</footer>
