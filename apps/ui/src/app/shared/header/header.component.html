<header [class.scrolled]="scrolled()">
  <mat-toolbar class="app-header">
    <div
      class="header-container mx-auto flex w-full max-w-6xl items-center justify-between gap-4 px-4"
    >
      <a routerLink="/" class="brand-link flex min-h-11 items-center no-underline">
        <app-brand-mark class="brand-mark" />
      </a>

      <div class="flex items-center gap-2 sm:gap-3">
        <nav
          i18n-aria-label="Name of the main site navigation landmark@@header.nav.ariaLabel"
          aria-label="Primary"
          class="hidden items-center gap-2 sm:flex"
        >
          @for (link of navLinks; track link.fragment) {
            <a
              matButton
              class="min-h-11 uppercase tracking-widest text-xs"
              routerLink="/"
              [fragment]="link.fragment"
            >
              {{ link.label }}
            </a>
          }
        </nav>

        <app-language-selector />
      </div>
    </div>
  </mat-toolbar>
</header>
